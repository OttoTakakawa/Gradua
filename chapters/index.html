<style id="page-styles">
html { scroll-behavior: smooth; }

.wrap {
  width: min(1520px, calc(100% - 56px));
  padding-top: 60px;
  padding-bottom: 76px;
}

h1 {
  font-size: clamp(34px, 4vw, 50px);
  line-height: 1.2;
  color: var(--text-dark);
  margin-bottom: 16px;
}

.lead {
  max-width: 980px;
  color: var(--text-soft);
  font-size: 17px;
  line-height: 1.9;
  margin: 0 auto;
  text-align: center;
}

.map-wrap {
  margin-top: 0;
}

.map-shell {
  position: relative;
  overflow: hidden;
  border-radius: 0;
  background: rgba(255,255,255,0.62);
  max-width: 1280px;
  aspect-ratio: 3 / 2;
  margin: 0 auto;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.2) 6%, rgba(0,0,0,0.5) 12%, #000 20%, #000 80%, rgba(0,0,0,0.5) 88%, rgba(0,0,0,0.2) 94%, transparent 100%);
  mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.2) 6%, rgba(0,0,0,0.5) 12%, #000 20%, #000 80%, rgba(0,0,0,0.5) 88%, rgba(0,0,0,0.2) 94%, transparent 100%);
}

.map-shell img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
}

.hotspot {
  position: absolute;
  display: block;
  border: 1px solid rgba(255,255,255,0.28);
  background: rgba(255,255,255,0.02);
  backdrop-filter: blur(1px);
  transition: all .28s ease;
  cursor: pointer;
  outline: none;
}

.hotspot:hover,
.hotspot:focus {
  transform: scale(1.02);
  box-shadow: 0 0 0 1px rgba(114,138,176,0.20), 0 18px 36px rgba(63,110,147,0.14);
  background: rgba(114,138,176,0.08);
}

.hotspot::after {
  content: attr(data-title);
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  white-space: nowrap;
  padding: 12px 20px;
  border-radius: 999px;
  background: rgba(255,255,255,0.92);
  color: var(--text-dark);
  font-size: 15px;
  letter-spacing: .08em;
  opacity: 0;
  transition: .25s ease;
  pointer-events: none;
  box-shadow: 0 10px 20px rgba(73,102,128,0.14);
}

.hotspot:hover::after,
.hotspot:focus::after { opacity: 1; }

.shape-1 {
  left: 1%; top: 28%;
  width: 22%; height: 40%;
  clip-path: polygon(22% 0, 100% 8%, 86% 100%, 0 74%, 10% 34%);
}

.shape-2 {
  left: 20%; top: 28%;
  width: 22%; height: 38%;
  clip-path: polygon(12% 4%, 100% 18%, 82% 100%, 6% 80%, 0 24%);
}

.shape-3 {
  left: 54%; top: 28%;
  width: 22%; height: 40%;
  clip-path: polygon(0 16%, 84% 0, 100% 84%, 24% 100%, 6% 66%);
}

.shape-4 {
  left: 76%; top: 28%;
  width: 22%; height: 40%;
  clip-path: polygon(16% 0, 100% 20%, 82% 100%, 0 78%, 4% 24%);
}

.map-tip {
  margin-top: 18px;
  text-align: center;
  color: var(--text-soft);
  font-size: 15px;
  line-height: 1.9;
}

footer a {
  color: var(--text-soft);
  text-decoration: underline;
}

@media (max-width: 700px) {
  .hotspot::after { display: none; }
}
</style>
</head>

<svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <defs>
    <filter id="lg-distort" x="-12%" y="-12%" width="124%" height="124%"
            color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.022"
                    numOctaves="3" seed="8" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="gray"/>
      <feDisplacementMap in="SourceGraphic" in2="gray"
                         scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>
