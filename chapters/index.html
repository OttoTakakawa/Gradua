<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>章节总览 — Within · 协作同行</title>
<style>*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { overflow-y: scroll; scrollbar-gutter: stable; overscroll-behavior-y: none; }

:root {
  --text-main: #4a5560;
  --text-dark: #2c3a4a;
  --text-soft: #8899a8;
  --cyan: #8ab4c4;
  --blue: #6b8fa3;
  --border: rgba(112,136,160,0.16);
  --shadow: 0 20px 60px rgba(99,124,148,0.10);
}

html { scroll-behavior: smooth; }

body {
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  color: var(--text-main);
  background:
    radial-gradient(circle at 20% 15%, rgba(138,180,196,0.10), transparent 35%),
    radial-gradient(circle at 80% 35%, rgba(212,196,168,0.10), transparent 35%),
    linear-gradient(180deg, #f5f7fa 0%, #eef1f5 50%, #edf0f4 100%);
  overflow-x: hidden;
  overflow-y: clip;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: 0.03;
  background-image:
    linear-gradient(135deg, transparent 0 48%, rgba(90,120,145,0.8) 49%, transparent 50%),
    linear-gradient(45deg, transparent 0 48%, rgba(90,120,145,0.6) 49%, transparent 50%);
  background-size: 72px 72px, 96px 96px;
}

.nav {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  z-index: 30;
  display: flex;
  justify-content: center;
  gap: 10px;
  padding: 16px;
  backdrop-filter: blur(16px);
  background: rgba(245,247,250,0.68);
  border-bottom: 1px solid var(--border);
}

.nav a {
  padding: 10px 18px;
  border-radius: 999px;
  color: var(--text-soft);
  font-size: 14px;
  text-decoration: none;
  transition: all .25s ease;
}

.nav a:hover,
.nav a.active {
  color: var(--text-main);
  background: rgba(138,180,196,0.14);
}

.nav,
.wrap,
footer {
  transition: opacity .4s ease, transform .46s ease, filter .46s ease;
}

body.is-leaving-next .nav,
body.is-leaving-next .wrap,
body.is-leaving-next footer {
  opacity: 0;
  transform: translateY(-24px);
  filter: blur(3px);
}

body.is-leaving-prev .nav,
body.is-leaving-prev .wrap,
body.is-leaving-prev footer {
  opacity: 0;
  transform: translateY(24px);
  filter: blur(3px);
}

.prev-arm-hint {
  position: fixed;
  left: 50%;
  top: 156px;
  width: auto;
  min-height: 24px;
  padding: 8px 14px 8px 34px;
  border-radius: 999px;
  border: 1px solid rgba(148,176,200,0.24);
  background: rgba(245,247,250,0.86);
  backdrop-filter: blur(8px);
  transform: translateX(-50%) translateY(6px);
  opacity: 0;
  pointer-events: none;
  z-index: 36;
  transition: opacity .24s ease, transform .24s ease, background .24s ease;
  color: #5a7a8c;
  font-size: 12px;
  letter-spacing: .06em;
  white-space: nowrap;
}

.prev-arm-hint::before {
  content: "";
  position: absolute;
  left: 15px;
  top: 50%;
  width: 10px;
  height: 10px;
  border-left: 1.5px solid rgba(91,154,160,0.9);
  border-top: 1.5px solid rgba(91,154,160,0.9);
  transform: translateY(-28%) rotate(45deg);
}

.prev-arm-hint::after {
  content: "滚轮上滑，回到前一页";
}

body.is-prev-armed .prev-arm-hint {
  opacity: 0.92;
  transform: translateX(-50%) translateY(0);
}

.wrap {
  position: relative;
  z-index: 1;
  width: min(1120px, calc(100% - 36px));
  margin: 0 auto;
  padding: 104px 0 72px;
}

.eyebrow {
  color: var(--blue);
  letter-spacing: .18em;
  font-size: 13px;
  margin-bottom: 14px;
  text-transform: uppercase;
}

h1 {
  font-size: clamp(34px, 4vw, 46px);
  line-height: 1.2;
  color: var(--text-dark);
  margin-bottom: 16px;
}

.lead {
  max-width: 720px;
  color: var(--text-soft);
  font-size: 16px;
  line-height: 1.95;
}

.map-wrap {
  margin-top: 34px;
}

.map-shell {
  border: 1px solid rgba(148,176,200,0.20);
  box-shadow: var(--shadow);
}

.map-shell {
  position: relative;
  overflow: hidden;
  border-radius: 30px;
  background: rgba(255,255,255,0.58);
  max-width: 860px;
  margin: 0 auto;
}

.map-shell img {
  width: 100%;
  display: block;
}

.hotspot {
  position: absolute;
  display: block;
  border: 1px solid rgba(255,255,255,0.45);
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(1px);
  transition: all .28s ease;
  cursor: pointer;
  outline: none;
}

.hotspot:hover,
.hotspot:focus {
  transform: scale(1.02);
  box-shadow: 0 0 0 2px rgba(255,255,255,0.55), 0 18px 40px rgba(63,110,147,0.18);
  background: rgba(255,255,255,0.14);
}

.hotspot::after {
  content: attr(data-title);
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  white-space: nowrap;
  padding: 10px 16px;
  border-radius: 999px;
  background: rgba(255,255,255,0.92);
  color: var(--text-dark);
  font-size: 13px;
  letter-spacing: .04em;
  opacity: 0;
  transition: .25s ease;
  pointer-events: none;
  box-shadow: 0 10px 20px rgba(73,102,128,0.14);
}

.hotspot:hover::after,
.hotspot:focus::after { opacity: 1; }

.shape-1 {
  left: 4%; top: 20%;
  width: 36%; height: 32%;
  clip-path: polygon(22% 0, 100% 8%, 86% 100%, 0 74%, 10% 34%);
}

.shape-2 {
  right: 5%; top: 20%;
  width: 35%; height: 30%;
  clip-path: polygon(12% 4%, 100% 18%, 82% 100%, 6% 80%, 0 24%);
}

.shape-3 {
  left: 8%; top: 54%;
  width: 36%; height: 30%;
  clip-path: polygon(0 16%, 84% 0, 100% 84%, 24% 100%, 6% 66%);
}

.shape-4 {
  right: 6%; top: 52%;
  width: 34%; height: 32%;
  clip-path: polygon(16% 0, 100% 20%, 82% 100%, 0 78%, 4% 24%);
}

.map-tip {
  margin-top: 18px;
  text-align: center;
  color: var(--text-soft);
  font-size: 14px;
  line-height: 1.9;
}

footer {
  text-align: center;
  padding: 24px;
  color: var(--text-soft);
  font-size: 13px;
  position: relative;
  z-index: 1;
}

footer a {
  color: var(--text-soft);
  text-decoration: underline;
}

@media (max-width: 700px) {
  .nav {
    justify-content: flex-start;
    overflow-x: auto;
    gap: 6px;
  }

  .nav a {
    padding: 8px 14px;
    font-size: 13px;
    white-space: nowrap;
  }

  .wrap {
    width: min(100%, calc(100% - 28px));
    padding: 84px 0 40px;
  }

  .prev-arm-hint {
    top: 124px;
    font-size: 11px;
    padding: 7px 12px 7px 30px;
  }

  .hotspot::after { display: none; }
}
</style>
</head>

<div class="prev-arm-hint" aria-hidden="true"></div>

<div class="wrap">
  <div class="eyebrow">CHAPTER OVERVIEW</div>
  <h1>章节总览</h1>
  <p class="lead">
    点击海报中的四个章节碎片，进入对应章节页面。
    这里仅负责建立整体顺序与入口，不展开章节正文。
  </p>

  <div class="map-wrap">
    <div class="map-shell">
      <img src="../images/剪贴板图片.jpg" alt="Within 可点击海报导航">
      <a class="hotspot shape-1" href="chapter-1/index.html" data-title="第一章 · 孤独的城市" aria-label="进入第一章 孤独的城市"></a>
      <a class="hotspot shape-2" href="chapter-2/index.html" data-title="第二章 · 萨沙的家" aria-label="进入第二章 萨沙的家"></a>
      <a class="hotspot shape-3" href="chapter-3/index.html" data-title="第三章 · 皮埃尔的梦想" aria-label="进入第三章 皮埃尔的梦想"></a>
      <a class="hotspot shape-4" href="chapter-4/index.html" data-title="第四章 · 太空之梦" aria-label="进入第四章 太空之梦"></a>
    </div>
  </div>

  <p class="map-tip">
    点击海报碎片进入对应章节
  </p>
</div>

<footer>
  Within · 协作同行 ｜ 章节导览
</footer>
<script>
(function () {
  var prevTarget = '../design/index.html';
  var nextTarget = 'chapter-1/index.html';
  var wrap = document.querySelector('.wrap');
  var navigating = false;
  var prevArmed = false;
  var threshold = 4;
  var delay = 420;
  var pullOpenDistance = 240;
  var armedLockUntil = 0;
  var armedGraceMs = 960;
  var armedConfirmReadyAt = 0;
  var armedConfirmCooldownMs = 360;

  function applyPull(distance) {
    if (wrap) {
      wrap.style.transform = distance ? 'translateY(' + distance + 'px)' : '';
    }
  }

  function clearPrevArm() {
    prevArmed = false;
    armedLockUntil = 0;
    armedConfirmReadyAt = 0;
    document.body.classList.remove('is-prev-armed');
  }

  function openPrevPull() {
    if (!prevTarget || navigating) return;
    var now = Date.now();
    prevArmed = true;
    armedLockUntil = now + armedGraceMs;
    armedConfirmReadyAt = now + armedConfirmCooldownMs;
    document.body.classList.add('is-prev-armed');
    applyPull(pullOpenDistance);
  }

  function closePrevPull() {
    clearPrevArm();
    applyPull(0);
  }

  function go(target, direction) {
    if (!target || navigating) return;
    navigating = true;
    closePrevPull();
    document.body.classList.add(direction === 'prev' ? 'is-leaving-prev' : 'is-leaving-next');
    window.setTimeout(function () {
      window.location.href = target;
    }, delay);
  }

  window.addEventListener('wheel', function (event) {
    if (navigating) {
      event.preventDefault();
      return;
    }

    var doc = document.documentElement;
    var atTop = window.scrollY <= threshold;
    var atBottom = window.innerHeight + window.scrollY >= doc.scrollHeight - threshold;

    if (prevArmed) {
      event.preventDefault();
      var now = Date.now();
      if (event.deltaY < -8 && prevTarget) {
        if (now < armedConfirmReadyAt) {
          return;
        }
        go(prevTarget, 'prev');
        return;
      }
      if (event.deltaY > 10 && now >= armedLockUntil) {
        closePrevPull();
      }
      return;
    }

    if (event.deltaY < -12 && atTop && prevTarget) {
      event.preventDefault();
      openPrevPull();
      return;
    }

    if (event.deltaY > 12 && atBottom && nextTarget) {
      event.preventDefault();
      closePrevPull();
      go(nextTarget, 'next');
      return;
    }

    if (!atTop || event.deltaY > 6) {
      closePrevPull();
    }
  }, { passive: false });

  window.addEventListener('scroll', function () {
    if (prevArmed) {
      if (window.scrollY > threshold + 2) {
        window.scrollTo(0, 0);
      }
      return;
    }

    if (window.scrollY > threshold + 2) {
      closePrevPull();
    }
  }, { passive: true });
})();
</script>
</body>
