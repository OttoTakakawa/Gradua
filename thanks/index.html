<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>感谢 — Within · 协作同行</title>
<style>
/* ========== Within 感谢页 ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { overflow-y: scroll; scrollbar-gutter: stable; overscroll-behavior-y: none; }

body {
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  color: #4a5560;
  background:
    radial-gradient(circle at 20% 15%, rgba(138,180,196,0.10), transparent 35%),
    radial-gradient(circle at 80% 35%, rgba(212,196,168,0.10), transparent 35%),
    linear-gradient(180deg, #f5f7fa 0%, #eef1f5 50%, #edf0f4 100%);
  overflow-x: hidden;
  min-height: 100vh;
  display: flex; flex-direction: column;
}
body::before {
  content: ""; position: fixed; inset: 0;
  pointer-events: none; z-index: 0; opacity: 0.03;
  background-image:
    linear-gradient(135deg, transparent 0 48%, rgba(90,120,145,0.8) 49%, transparent 50%),
    linear-gradient(45deg, transparent 0 48%, rgba(90,120,145,0.6) 49%, transparent 50%);
  background-size: 72px 72px, 96px 96px;
}

.nav {
  position: fixed; top: 0; left: 0; width: 100%; z-index: 30;
  display: flex; justify-content: center; gap: 10px;
  padding: 16px;
  backdrop-filter: blur(16px);
  background: rgba(245,247,250,0.65);
  border-bottom: 1px solid rgba(112,136,160,0.16);
}
.nav a {
  padding: 10px 18px; border-radius: 999px;
  color: #8899a8; font-size: 14px;
  text-decoration: none;
  transition: all .25s ease;
}
.nav a:hover, .nav a.active {
  color: #4a5560;
  background: rgba(138,180,196,0.14);
}

.nav,
.wrap,
footer {
  transition: opacity .4s ease, transform .46s ease, filter .46s ease;
}

body.is-leaving-next .nav,
body.is-leaving-next .wrap,
body.is-leaving-next footer {
  opacity: 0;
  transform: translateY(-24px);
  filter: blur(3px);
}

body.is-leaving-prev .nav,
body.is-leaving-prev .wrap,
body.is-leaving-prev footer {
  opacity: 0;
  transform: translateY(24px);
  filter: blur(3px);
}

.prev-arm-hint {
  position: fixed;
  left: 50%;
  top: 156px;
  width: auto;
  min-height: 24px;
  padding: 8px 14px 8px 34px;
  border-radius: 999px;
  border: 1px solid rgba(148,176,200,0.24);
  background: rgba(245,247,250,0.86);
  backdrop-filter: blur(8px);
  transform: translateX(-50%) translateY(6px);
  opacity: 0;
  pointer-events: none;
  z-index: 36;
  transition: opacity .24s ease, transform .24s ease, background .24s ease;
  color: #5a7a8c;
  font-size: 12px;
  letter-spacing: .06em;
  white-space: nowrap;
}

.prev-arm-hint::before {
  content: "";
  position: absolute;
  left: 15px;
  top: 50%;
  width: 10px;
  height: 10px;
  border-left: 1.5px solid rgba(91,154,160,0.9);
  border-top: 1.5px solid rgba(91,154,160,0.9);
  transform: translateY(-28%) rotate(45deg);
}

.prev-arm-hint::after {
  content: "滚轮上滑，回到前一页";
}

body.is-prev-armed .prev-arm-hint {
  opacity: 0.92;
  transform: translateX(-50%) translateY(0);
}

.wrap {
  position: relative; z-index: 1;
  width: min(860px, calc(100% - 36px));
  margin: 0 auto;
  padding: 104px 0 72px;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.eyebrow {
  text-align: center;
  color: #6b8fa3; letter-spacing: .18em;
  font-size: 13px; margin-bottom: 14px;
  text-transform: uppercase;
}

.thanks-card {
  padding: 56px 40px; border-radius: 32px;
  background: linear-gradient(180deg, rgba(255,255,255,0.78), rgba(255,255,255,0.50));
  border: 1px solid rgba(148,176,200,0.18);
  box-shadow: 0 20px 60px rgba(99,124,148,0.10);
  position: relative; overflow: hidden;
  text-align: center;
}
.thanks-card::before, .thanks-card::after {
  content: ""; position: absolute;
  width: 200px; height: 200px;
  border: 1px solid rgba(126,164,193,0.12);
  background: linear-gradient(145deg, rgba(255,255,255,0.20), rgba(138,180,196,0.05));
  clip-path: polygon(14% 0, 100% 14%, 82% 100%, 0 84%);
}
.thanks-card::before { left: -50px; top: -50px; }
.thanks-card::after { right: -50px; bottom: -50px; }

.thanks-title {
  font-size: clamp(40px, 5vw, 72px);
  color: #5a7a8c; letter-spacing: .08em;
  margin-bottom: 16px; font-weight: 600;
  position: relative; z-index: 1;
}
.thanks-sub {
  font-size: 17px; color: #8899a8;
  line-height: 2.0; max-width: 560px;
  margin: 0 auto;
  position: relative; z-index: 1;
}

.credits {
  display: flex; justify-content: center;
  flex-wrap: wrap; gap: 12px;
  margin-top: 32px;
  position: relative; z-index: 1;
}
.credit {
  padding: 12px 20px; border-radius: 999px;
  background: rgba(255,255,255,0.74);
  border: 1px solid rgba(148,176,200,0.16);
  color: #4a5560; font-size: 14px;
  transition: all .2s ease;
}
.credit:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(99,124,148,0.08);
}

footer {
  text-align: center; padding: 24px;
  color: #8899a8; font-size: 13px;
  position: relative; z-index: 1;
}

@media (max-width: 700px) {
  .nav { justify-content: flex-start; overflow-x: auto; gap: 6px; }
  .nav a { padding: 8px 14px; font-size: 13px; white-space: nowrap; }
  .wrap { width: min(100%, calc(100% - 28px)); padding: 84px 0 40px; }
  .thanks-card { padding: 40px 24px; }
  .thanks-title { font-size: 40px; }
  .prev-arm-hint { top: 124px; font-size: 11px; padding: 7px 12px 7px 30px; }
}
</style>
</head>
<body>

<nav class="nav">
  <a href="../index.html">首页</a>
  <a href="../about/index.html">项目介绍</a>
  <a href="../research/index.html">问题研究</a>
  <a href="../design/index.html">核心设计</a>

  <a href="../process/index.html">制作过程</a>
  <a href="../thanks/index.html" class="active">感谢</a>
</nav>
<div class="prev-arm-hint" aria-hidden="true"></div>

<div class="wrap">
  <div class="eyebrow">THANKS</div>
  <div class="thanks-card">
    <div class="thanks-title">感谢观看</div>
    <p class="thanks-sub">
      感谢所有指导、陪伴与参与这个项目的人。<br>
      Within 不是单纯的 VR 展示，<br>
      而是一段关于理解、陪伴与共同前行的体验。
    </p>
    <div class="credits">
      <!-- 这里改感谢内容 —— 替换成具体人名或信息 -->
      <div class="credit">指导教师</div>
      <div class="credit">测试参与者</div>
      <div class="credit">项目协作者</div>
      <div class="credit">答辩评审</div>
    </div>
    <p style="margin-top:28px;font-size:14px;color:#8899a8;letter-spacing:.1em;">
      Within · 协作同行 ｜ 愿每一段旅程都有人同行
    </p>
  </div>

</div>

<footer>
  Within · 协作同行 ｜ VR 互动体验作品
</footer>

<script>
(function () {
  var prevTarget = '../process/index.html';
  var nextTarget = null;
  var wrap = document.querySelector('.wrap');
  var navigating = false;
  var prevArmed = false;
  var threshold = 4;
  var delay = 420;
  var pullOpenDistance = 240;
  var armedLockUntil = 0;
  var armedGraceMs = 960;
  var armedConfirmReadyAt = 0;
  var armedConfirmCooldownMs = 360;

  function applyPull(distance) {
    if (wrap) {
      wrap.style.transform = distance ? 'translateY(' + distance + 'px)' : '';
    }
  }

  function clearPrevArm() {
    prevArmed = false;
    armedLockUntil = 0;
    armedConfirmReadyAt = 0;
    document.body.classList.remove('is-prev-armed');
  }

  function openPrevPull() {
    if (!prevTarget || navigating) return;
    var now = Date.now();
    prevArmed = true;
    armedLockUntil = now + armedGraceMs;
    armedConfirmReadyAt = now + armedConfirmCooldownMs;
    document.body.classList.add('is-prev-armed');
    applyPull(pullOpenDistance);
  }

  function closePrevPull() {
    clearPrevArm();
    applyPull(0);
  }

  function go(target, direction) {
    if (!target || navigating) return;
    navigating = true;
    closePrevPull();
    document.body.classList.add(direction === 'prev' ? 'is-leaving-prev' : 'is-leaving-next');
    window.setTimeout(function () {
      window.location.href = target;
    }, delay);
  }

  window.addEventListener('wheel', function (event) {
    if (navigating) {
      event.preventDefault();
      return;
    }

    var doc = document.documentElement;
    var atTop = window.scrollY <= threshold;

    if (prevArmed) {
      event.preventDefault();
      var now = Date.now();
      if (event.deltaY < -8 && prevTarget) {
        if (now < armedConfirmReadyAt) {
          return;
        }
        go(prevTarget, 'prev');
        return;
      }
      if (event.deltaY > 10 && now >= armedLockUntil) {
        closePrevPull();
      }
      return;
    }

    if (event.deltaY < -12 && atTop && prevTarget) {
      event.preventDefault();
      openPrevPull();
      return;
    }

    if (nextTarget && event.deltaY > 12 && window.innerHeight + window.scrollY >= doc.scrollHeight - threshold) {
      event.preventDefault();
      closePrevPull();
      go(nextTarget, 'next');
      return;
    }

    if (!atTop || event.deltaY > 6) {
      closePrevPull();
    }
  }, { passive: false });

  window.addEventListener('scroll', function () {
    if (prevArmed) {
      if (window.scrollY > threshold + 2) {
        window.scrollTo(0, 0);
      }
      return;
    }

    if (window.scrollY > threshold + 2) {
      closePrevPull();
    }
  }, { passive: true });
})();
</script>

</body>
</html>
