<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Within · 协作同行</title>
<link rel="stylesheet" href="shared.css">
<style id="page-styles">
.cover {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 104px 24px 180px;
}

.poly-bg {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow-x: hidden;
}

.poly {
  position: absolute;
  border: 1px solid rgba(124, 151, 173, 0.16);
  background: linear-gradient(145deg, rgba(255,255,255,0.28), rgba(138,180,196,0.08));
  box-shadow: 0 18px 42px rgba(95, 118, 138, 0.05);
}

body.is-leaving-next .poly {
  opacity: 0;
  transform: translateY(24px) scale(0.96);
}

.poly-1 {
  top: 15%;
  left: 8%;
  width: 220px;
  height: 180px;
  clip-path: polygon(10% 18%, 74% 0, 100% 34%, 84% 100%, 0 78%);
  transform: rotate(-10deg);
}

.poly-2 {
  top: 18%;
  right: 12%;
  width: 280px;
  height: 220px;
  clip-path: polygon(20% 0, 100% 22%, 84% 100%, 6% 86%, 0 28%);
  transform: rotate(8deg);
}

.poly-3 {
  bottom: 16%;
  left: 14%;
  width: 240px;
  height: 190px;
  clip-path: polygon(0 20%, 78% 0, 100% 76%, 26% 100%);
  transform: rotate(12deg);
}

.poly-4 {
  bottom: 14%;
  right: 10%;
  width: 320px;
  height: 240px;
  clip-path: polygon(18% 0, 100% 18%, 88% 100%, 0 82%, 4% 26%);
  transform: rotate(-7deg);
}

.poly-5 {
  top: 44%;
  left: 18%;
  width: 140px;
  height: 120px;
  clip-path: polygon(16% 0, 100% 28%, 68% 100%, 0 74%);
  background: linear-gradient(145deg, rgba(138,180,196,0.16), rgba(255,255,255,0.08));
  opacity: 0.9;
}

.poly-6 {
  top: 54%;
  right: 22%;
  width: 160px;
  height: 140px;
  clip-path: polygon(0 22%, 70% 0, 100% 68%, 18% 100%);
  background: linear-gradient(145deg, rgba(196,168,130,0.12), rgba(255,255,255,0.08));
  opacity: 0.78;
}

.logo-shell {
  position: relative;
  width: auto;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: none;
}

.logo {
  position: relative;
  z-index: 1;
  text-align: center;
}

body.is-leaving-next .logo {
  opacity: 0;
  transform: translateY(-18px) scale(0.985);
  filter: blur(3px);
}

.logo-image {
  display: block;
  width: min(760px, 78vw);
  max-width: 100%;
  height: auto;
  object-fit: contain;
  filter: drop-shadow(0 18px 42px rgba(58, 76, 96, 0.18));
}

.logo-caption {
  margin-top: 18px;
  color: rgba(108, 130, 146, 0.88);
  font-size: 13px;
  letter-spacing: .12em;
  line-height: 1.9;
}

body.is-next-armed .page-index .next-arm-hint {
  position: absolute;
  left: 50%;
  bottom: 28px;
  transform: translateX(-50%) translateY(0);
}

@media (max-width: 860px) {
  body.is-next-armed .page-index .next-arm-hint {
    bottom: 16px;
  }
}

@media (max-width: 860px) {
  .cover {
    padding: 84px 14px 140px;
  }

  .logo-shell {
    width: 100%;
  }

  .poly {
    opacity: 0.7;
  }

  .poly-1,
  .poly-2,
  .poly-3,
  .poly-4 {
    width: 160px;
    height: 130px;
  }

  .poly-5,
  .poly-6 {
    width: 100px;
    height: 86px;
  }

}
</style>
</head>
<body class="page-index">

<svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <defs>
    <filter id="lg-distort" x="-12%" y="-12%" width="124%" height="124%"
            color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.022"
                    numOctaves="3" seed="8" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="gray"/>
      <feDisplacementMap in="SourceGraphic" in2="gray"
                         scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>
