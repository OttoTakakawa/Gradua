<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Within · 协作同行</title>
<style>*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { overflow-y: scroll; scrollbar-gutter: stable; }

:root {
  --text-main: #465564;
  --text-dark: #243241;
  --text-soft: #7d8f9f;
  --cyan: #8ab4c4;
  --cyan-deep: #5b9aa0;
  --blue: #6b8fa3;
  --border: rgba(112,136,160,0.14);
}

body {
  min-height: 100vh;
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  color: var(--text-main);
  background:
    radial-gradient(circle at 14% 14%, rgba(138,180,196,0.12), transparent 28%),
    radial-gradient(circle at 84% 18%, rgba(196,168,130,0.10), transparent 30%),
    linear-gradient(180deg, #f6f8fb 0%, #eef2f6 46%, #edf1f4 100%);
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: 0.025;
  background-image:
    linear-gradient(135deg, transparent 0 48%, rgba(90,120,145,0.9) 49%, transparent 50%),
    linear-gradient(45deg, transparent 0 48%, rgba(90,120,145,0.55) 49%, transparent 50%);
  background-size: 92px 92px, 126px 126px;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 6;
  opacity: 0;
  background:
    radial-gradient(circle at 50% 42%, rgba(255,255,255,0.72), rgba(241,246,249,0.96) 58%, rgba(238,242,246,1) 100%);
  transition: opacity .48s ease;
}

body.is-leaving::after {
  opacity: 1;
}

.nav {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  z-index: 20;
  display: flex;
  justify-content: center;
  gap: 10px;
  padding: 16px;
  backdrop-filter: blur(16px);
  background: rgba(246,248,251,0.68);
  border-bottom: 1px solid var(--border);
}

.nav a {
  padding: 10px 18px;
  border-radius: 999px;
  color: var(--text-soft);
  font-size: 14px;
  text-decoration: none;
  transition: all .25s ease;
}

.nav a:hover,
.nav a.active {
  color: var(--text-main);
  background: rgba(138,180,196,0.12);
}

.nav,
.logo,
.poly {
  transition: opacity .42s ease, transform .48s ease, filter .48s ease;
}

body.is-leaving .nav {
  opacity: 0;
  transform: translateY(-10px);
}

.cover {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 104px 24px 40px;
}

.poly-bg {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow-x: hidden;
}

.poly {
  position: absolute;
  border: 1px solid rgba(124, 151, 173, 0.16);
  background: linear-gradient(145deg, rgba(255,255,255,0.28), rgba(138,180,196,0.08));
  box-shadow: 0 18px 42px rgba(95, 118, 138, 0.05);
}

body.is-leaving .poly {
  opacity: 0;
  transform: translateY(24px) scale(0.96);
}

.poly-1 {
  top: 15%;
  left: 8%;
  width: 220px;
  height: 180px;
  clip-path: polygon(10% 18%, 74% 0, 100% 34%, 84% 100%, 0 78%);
  transform: rotate(-10deg);
}

.poly-2 {
  top: 18%;
  right: 12%;
  width: 280px;
  height: 220px;
  clip-path: polygon(20% 0, 100% 22%, 84% 100%, 6% 86%, 0 28%);
  transform: rotate(8deg);
}

.poly-3 {
  bottom: 16%;
  left: 14%;
  width: 240px;
  height: 190px;
  clip-path: polygon(0 20%, 78% 0, 100% 76%, 26% 100%);
  transform: rotate(12deg);
}

.poly-4 {
  bottom: 14%;
  right: 10%;
  width: 320px;
  height: 240px;
  clip-path: polygon(18% 0, 100% 18%, 88% 100%, 0 82%, 4% 26%);
  transform: rotate(-7deg);
}

.poly-5 {
  top: 44%;
  left: 18%;
  width: 140px;
  height: 120px;
  clip-path: polygon(16% 0, 100% 28%, 68% 100%, 0 74%);
  background: linear-gradient(145deg, rgba(138,180,196,0.16), rgba(255,255,255,0.08));
  opacity: 0.9;
}

.poly-6 {
  top: 54%;
  right: 22%;
  width: 160px;
  height: 140px;
  clip-path: polygon(0 22%, 70% 0, 100% 68%, 18% 100%);
  background: linear-gradient(145deg, rgba(196,168,130,0.12), rgba(255,255,255,0.08));
  opacity: 0.78;
}

.logo-shell {
  position: relative;
  width: auto;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: none;
}

.logo {
  position: relative;
  z-index: 1;
  text-align: center;
}

body.is-leaving .logo {
  opacity: 0;
  transform: translateY(-18px) scale(0.985);
  filter: blur(3px);
}

.logo-image {
  display: block;
  width: min(760px, 78vw);
  max-width: 100%;
  height: auto;
  object-fit: contain;
  filter: drop-shadow(0 18px 42px rgba(58, 76, 96, 0.18));
}

.logo-caption {
  margin-top: 18px;
  color: rgba(108, 130, 146, 0.88);
  font-size: 13px;
  letter-spacing: .12em;
  line-height: 1.9;
}

.scroll-hint {
  position: absolute;
  left: 50%;
  bottom: 30px;
  transform: translateX(-50%);
  z-index: 3;
  width: 26px;
  height: 26px;
  text-decoration: none;
  transition: transform .25s ease, opacity .25s ease;
}

.scroll-hint::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  width: 12px;
  height: 12px;
  border-right: 1.5px solid rgba(91,154,160,0.88);
  border-bottom: 1.5px solid rgba(91,154,160,0.88);
  transform: translate(-50%, -60%) rotate(45deg);
  animation: hintArrow 2.2s ease-in-out infinite;
}

.scroll-hint:hover {
  transform: translateX(-50%) translateY(-2px);
  opacity: 0.85;
}

body.is-leaving .scroll-hint {
  opacity: 0;
  transform: translateX(-50%) translateY(10px);
}

@keyframes hintArrow {
  0% {
    opacity: 0.28;
    transform: translate(-50%, -72%) rotate(45deg);
  }
  35% {
    opacity: 0.9;
  }
  70% {
    opacity: 0.9;
    transform: translate(-50%, -42%) rotate(45deg);
  }
  100% {
    opacity: 0.28;
    transform: translate(-50%, -28%) rotate(45deg);
  }
}

@media (max-width: 860px) {
  .nav {
    justify-content: flex-start;
    overflow-x: auto;
    gap: 6px;
  }

  .nav a {
    white-space: nowrap;
    padding: 8px 14px;
    font-size: 13px;
  }

  .cover {
    padding: 84px 14px 20px;
  }

  .logo-shell {
    width: 100%;
  }

  .poly {
    opacity: 0.7;
  }

  .poly-1,
  .poly-2,
  .poly-3,
  .poly-4 {
    width: 160px;
    height: 130px;
  }

  .poly-5,
  .poly-6 {
    width: 100px;
    height: 86px;
  }

  .scroll-hint {
    bottom: 22px;
  }
}
</style>
</head>
<body>
<nav class="nav">
  <a href="index.html" class="active">首页</a>
  <a href="about/index.html">项目介绍</a>
  <a href="research/index.html">问题研究</a>
  <a href="design/index.html">核心设计</a>
  <a href="chapters/index.html">章节导览</a>
  <a href="process/index.html">制作过程</a>
  <a href="thanks/index.html">感谢</a>
</nav>

<main class="cover">
  <div class="poly-bg" aria-hidden="true">
    <div class="poly poly-1"></div>
    <div class="poly poly-2"></div>
    <div class="poly poly-3"></div>
    <div class="poly poly-4"></div>
    <div class="poly poly-5"></div>
    <div class="poly poly-6"></div>
  </div>
  <div class="logo-shell" aria-label="Within 协作同行">
    <div class="logo">
      <img class="logo-image" src="title.png" alt="Within 协作同行">
      <div class="logo-caption">具身认知视角下大学生社交数字化设计研究</div>
    </div>
  </div>
  <a class="scroll-hint" href="about/index.html" aria-label="向下进入项目介绍"></a>
</main>
<script>
(function () {
  var target = 'about/index.html';
  var navigating = false;
  var touchStartY = null;
  var delay = 430;
  var hint = document.querySelector('.scroll-hint');

  function navigateTo(targetHref, event) {
    if (navigating || !targetHref) return;
    if (event) event.preventDefault();
    navigating = true;
    document.body.classList.add('is-leaving');
    window.setTimeout(function () {
      window.location.href = targetHref;
    }, delay);
  }

  function goNext(event) {
    navigateTo(target, event);
  }

  function bindNavLinks() {
    var navLinks = document.querySelectorAll('.nav a[href]');
    navLinks.forEach(function (link) {
      link.addEventListener('click', function (event) {
        if (navigating) {
          event.preventDefault();
          return;
        }
        if (event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) {
          return;
        }
        var href = link.getAttribute('href');
        if (!href || link.classList.contains('active')) return;
        navigateTo(href, event);
      });
    });
  }

  window.addEventListener('wheel', function (event) {
    if (event.deltaY > 8) {
      goNext(event);
    }
  }, { passive: true });

  window.addEventListener('keydown', function (event) {
    if (event.key === 'ArrowDown' || event.key === 'PageDown' || event.key === ' ') {
      goNext(event);
    }
  });

  window.addEventListener('touchstart', function (event) {
    if (!event.touches || !event.touches.length) return;
    touchStartY = event.touches[0].clientY;
  }, { passive: true });

  window.addEventListener('touchend', function (event) {
    if (touchStartY === null || !event.changedTouches || !event.changedTouches.length) return;
    var deltaY = event.changedTouches[0].clientY - touchStartY;
    touchStartY = null;
    if (deltaY < -24) {
      goNext();
    }
  }, { passive: true });

  if (hint) {
    hint.addEventListener('click', goNext);
  }

  bindNavLinks();
})();
</script>
</body>
</html>
